[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-audio-studio"
version = "1.0.0"
description = "Incremental YouTube audio -> timestamped transcripts -> optional LLM articles"
requires-python = ">=3.10,<3.14"
dependencies = [
    "gradio>=5.0,<7.0",
    "yt-dlp[default]>=2026.8.0",
    "faster-whisper==1.2.1",
    "av==18.0.0",  # fixes faster-whisper 1.2.1 metadata_errors with PyAV 19
    "openai>=1.60,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
youtube-audio-studio = "studio.ui:main"

[tool.setuptools.packages.find]
include = ["studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
