name: Python / Notebook verification
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install project
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e .
      - name: Syntax
        run: python -m compileall -q studio
      - name: Unit and recovery tests
        run: pytest -q
      - name: Verify Colab embedded source
        run: python scripts/check_notebook_sync.py
